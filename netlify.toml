[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  STORAGE = "netlify-blobs"

[context.production.environment]
  STORAGE = "netlify-blobs"

# v4.1c PWA: the service worker must always be revalidated so updates reach phones.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

# v4.1h: organiser pages and API are private: never cached, never indexed, no referrer.
[[headers]]
  for = "/organiser/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
[[headers]]
  for = "/organiser"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
